<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentDock</title>
    <style>
      /* Garantir tema escuro sempre */
      :root {
        color-scheme: dark;
      }
      
      html {
        background: #0A0A0A;
      }
      
      /* Loading screen visível enquanto React carrega */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: #0A0A0A;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 2rem;
        z-index: 9999;
      }
      
      #loading-screen .logo {
        font-size: 48px;
        font-weight: bold;
        background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      #loading-screen .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #333;
        border-top-color: #3B82F6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      #loading-screen .text {
        color: #A0A0A0;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      
      /* Garante que o body e root tenham fundo escuro */
      body {
        margin: 0;
        background: #0A0A0A;
        color: #fff;
      }
      
      #root {
        min-height: 100vh;
        background: #0A0A0A;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-yUZxNUXu.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DWlCwCbD.css">
  </head>
  <body>
    <div id="loading-screen">
      <div class="logo">🚀 AgentDock</div>
      <div class="spinner"></div>
      <div class="text">Carregando AgentDock...</div>
    </div>
    <div id="root"></div>
    <script>
      // Remove loading screen quando React montar
      window.addEventListener('DOMContentLoaded', () => {
        console.log('✅ DOM carregado');
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            console.log('✅ React montou, removendo loading');
            document.getElementById('loading-screen')?.remove();
          } else {
            console.error('❌ React NÃO montou após 3s');
            const loading = document.getElementById('loading-screen');
            if (loading) {
              loading.innerHTML = `
                <div style="text-align: center; max-width: 400px; padding: 2rem;">
                  <div style="font-size: 48px; margin-bottom: 1rem;">⚠️</div>
                  <div style="color: #fff; font-size: 18px; margin-bottom: 1rem;">Erro ao carregar</div>
                  <div style="color: #888; font-size: 14px; line-height: 1.5;">
                    O React não conseguiu montar.<br><br>
                    Abra o DevTools (F12) para ver os erros.<br><br>
                    Possíveis causas:<br>
                    • Arquivos JS/CSS não encontrados<br>
                    • Erro no código React<br>
                    • Backend não está servindo os arquivos
                  </div>
                </div>
              `;
            }
          }
        }, 3000);
      });
    </script>
  </body>
</html>
