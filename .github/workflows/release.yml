name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build-installers:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Install dependencies
        run: npm install
        
      - name: Build .NET Backend
        run: dotnet publish src/AgentDock.Backend/AgentDock.Backend.csproj -c Release -o src/AgentDock.Backend/bin/Release/net8.0/publish
        
      - name: Download llama.cpp CPU variant (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Download CPU variant only for the installer
          # Users will download GPU variants via setup script
          $url = "https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-b4370-bin-win-cpu-x64.zip"
          Write-Host "Downloading llama.cpp CPU variant..."
          Invoke-WebRequest -Uri $url -OutFile "llama-cpu.zip"
          Expand-Archive -Path "llama-cpu.zip" -DestinationPath "llama.cpp/cpu" -Force
          Remove-Item "llama-cpu.zip"
          
      - name: Download llama.cpp CPU variant (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Download macOS variant
          curl -L -o llama-cpu.zip "https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-b4370-bin-macos-arm64.zip"
          unzip llama-cpu.zip -d llama.cpp/cpu
          rm llama-cpu.zip
          
      - name: Download llama.cpp CPU variant (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Download Linux variant
          curl -L -o llama-cpu.zip "https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-b4370-bin-ubuntu-x64.zip"
          unzip llama-cpu.zip -d llama.cpp/cpu
          rm llama-cpu.zip
          
      - name: Build Electron App
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          retention-days: 7
          
  create-release:
    needs: build-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            installer-windows-latest/**/*
            installer-macos-latest/**/*
            installer-ubuntu-latest/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  # Separate job to prepare llama.cpp variants for download
  prepare-llama-variants:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create llama.cpp download info
        run: |
          mkdir -p llama-variants
          cat > llama-variants/README.md << 'EOF'
          # llama.cpp Variants
          
          AgentDock uses llama.cpp for AI model inference. The installer includes only the CPU variant to keep the download size small.
          
          ## Download GPU-Specific Variants
          
          If you have a dedicated GPU, download the appropriate variant from [llama.cpp releases](https://github.com/ggerganov/llama.cpp/releases/latest):
          
          ### Windows
          - **NVIDIA GPU (CUDA 12.4)**: `llama-b4370-bin-win-cuda-cu12.4.1-x64.zip`
          - **AMD GPU (ROCm/HIP)**: `llama-b4370-bin-win-hip-x64.zip`
          - **Intel GPU (SYCL)**: `llama-b4370-bin-win-sycl-x64.zip`
          - **Vulkan (Universal)**: `llama-b4370-bin-win-vulkan-x64.zip`
          
          ### macOS
          - **Apple Silicon**: `llama-b4370-bin-macos-arm64.zip`
          - **Intel**: `llama-b4370-bin-macos-x64.zip`
          
          ### Linux
          - **CUDA**: `llama-b4370-bin-ubuntu-x64.zip` (with CUDA support)
          - **ROCm**: `llama-b4370-bin-ubuntu-x64.zip` (with ROCm support)
          
          ## Installation
          
          1. Download the appropriate variant
          2. Extract to `AgentDock/llama.cpp/[variant-name]/`
          3. The setup script will detect and use the correct variant
          
          For automatic installation, run the setup script which will detect your GPU and download the optimal variant.
          EOF
          
      - name: Upload llama.cpp info
        uses: actions/upload-artifact@v4
        with:
          name: llama-variants-info
          path: llama-variants/
          retention-days: 90
