<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentDock - Carregando...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      background: #0A0A0A;
      color-scheme: dark;
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0A0A0A;
      color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      text-align: center;
      padding: 40px;
    }
    
    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .spinner {
      width: 48px;
      height: 48px;
      margin: 30px auto;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .message {
      font-size: 18px;
      color: #A0A0A0;
      margin-top: 20px;
    }
    
    .status {
      font-size: 14px;
      color: #606060;
      margin-top: 10px;
      font-family: 'Courier New', monospace;
    }
    
    .dots {
      display: inline-block;
    }
    
    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🚀 AgentDock</div>
    <div class="spinner"></div>
    <div class="message">Carregando AgentDock<span class="dots"></span></div>
    <div class="status" id="status">Iniciando backend...</div>
  </div>

  <script>
    const statuses = [
      'Iniciando backend...',
      'Iniciando servidor .NET...',
      'Carregando modelos de IA...',
      'Preparando workspace...',
      'Quase pronto...'
    ];
    
    let currentStatus = 0;
    
    setInterval(() => {
      currentStatus = (currentStatus + 1) % statuses.length;
      document.getElementById('status').textContent = statuses[currentStatus];
    }, 2000);
  </script>
</body>
</html>
